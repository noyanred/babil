<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane Asistanı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1>Kütüphanem</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Kitap, yazar veya not ara...">
            
            <select id="statusFilter">
                <option value="all">Tümü</option>
                <option value="okundu">Okundu</option>
                <option value="sirada">Sırada</option>
                <option value="okunmadi">Okunmadı</option>
            </select>

            <select id="sortFilter">
                <option value="date-desc">Eklenme Tarihi (Yeni-Eski)</option>
                <option value="pages-asc">Sayfa (Azdan Çoğa)</option>
                <option value="pages-desc">Sayfa (Çoktan Aza)</option>
                <option value="year">Basım Yılı</option>
            </select>
        </div>
    </header>

    <main id="library-grid" class="grid-container">
        <!-- Kitaplar buraya JavaScript ile otomatik eklenecek -->
    </main>

    <!-- Sağ Alt Köşedeki Hızlı İşlem Butonu -->
    <button class="fab-btn" id="addBookBtn">+</button>

    <script src="app.js"></script>
</body>
</html>
