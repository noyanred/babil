<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane Asistanı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1>Kütüphanem</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Kitap veya yazar ara...">
            <select id="statusFilter">
                <option value="all">Tümü</option>
                <option value="okundu">Okundu</option>
                <option value="sirada">Sırada</option>
                <option value="okunmadi">Okunmadı</option>
            </select>
            <select id="sortFilter">
                <option value="date-desc">Eklenme (Yeni-Eski)</option>
                <option value="pages-asc">Sayfa (Azdan Çoğa)</option>
                <option value="pages-desc">Sayfa (Çoktan Aza)</option>
                <option value="year">Basım Yılı</option>
            </select>
        </div>
    </header>

    <main id="library-grid" class="grid-container"></main>

    <button class="fab-btn" id="addBookBtn">+</button>

    <!-- KİTAP DETAY VE DURUM GÜNCELLEME PENCERESİ -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <div class="modal-header">
                <img id="modalCover" class="modal-cover" src="" alt="Kapak">
                <div class="modal-info">
                    <h2 id="modalTitle">Kitap Adı</h2>
                    <p id="modalAuthor" class="modal-author">Yazar Adı</p>
                    <span id="modalStatus" class="status-badge">Durum</span>
                </div>
            </div>
            <div class="modal-body">
                <p><strong>Yayınevi:</strong> <span id="modalPublisher">-</span></p>
                <p><strong>Yıl:</strong> <span id="modalYear">-</span></p>
                <p><strong>Dil:</strong> <span id="modalLang">-</span></p>
                <p><strong>Sayfa:</strong> <span id="modalPages">-</span></p>
                
                <!-- KİŞİSEL NOT ALANI -->
                <div style="margin-top: 15px; padding: 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; font-size: 13px; text-align: left; max-height: 150px; overflow-y: auto;">
                    <strong>Notlarım / Özet:</strong><br>
                    <span id="modalNotes" style="display: block; margin-top: 5px; opacity: 0.9; white-space: pre-wrap;">Not eklenmemiş.</span>
                </div>
                
                <div style="margin-top: 15px; display: flex; gap: 10px;">
                    <select id="editStatusSelect" style="flex: 1; min-width: 0;">
                        <option value="okunmadi">Okunmadı</option>
                        <option value="sirada">Sırada</option>
                        <option value="okundu">Okundu</option>
                    </select>
                    <button id="updateStatusBtn" class="action-btn" style="margin-top: 0; background-color: var(--badge-okundu); color: #000;">Durumu Güncelle</button>
                </div>
                <button id="editBookBtn" class="action-btn" style="background-color: var(--badge-sirada); color: #000; margin-top: 10px;">✏️ Bilgileri / Notları Düzenle</button>
                <button id="deleteBookBtn" class="action-btn" style="background-color: #ff7675; color: #000; margin-top: 10px;">🗑️ Kütüphaneden Sil</button>
            </div>
        </div>
    </div>

    <!-- İLK TERCİH MENÜSÜ (+ Butonu) -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeAddModal">&times;</span>
            <h2 style="margin-bottom: 15px;">Yeni Kitap Ekle</h2>
            <div style="display: flex; flex-direction: column; gap: 10px;">
                <button id="scanBarcodeBtn" class="action-btn">📷 Barkod Okut</button>
                <button id="manualAddBtn" class="action-btn">🔍 Gelişmiş Arama / Elle Ekle</button>
            </div>
            <div id="reader" style="width: 100%; margin-top: 15px; display: none;"></div>
        </div>
    </div>

    <!-- GELİŞMİŞ ARAMA, DÜZENLEME VE NOT PENCERESİ -->
    <div id="searchModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeSearchModal">&times;</span>
            <h2 id="searchModalTitle" style="margin-bottom: 15px;">İnternette Kitap Ara</h2>
            <form id="advancedSearchForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="sTitle" placeholder="Kitap Adı / ISBN / Genel Arama (Zorunlu)" required>
                <input type="text" id="sAuthor" placeholder="Yazar Adı (Opsiyonel)">
                <input type="text" id="sPublisher" placeholder="Yayınevi (Opsiyonel)">
                
                <div style="display: flex; gap: 10px;">
                    <input type="number" id="sYear" placeholder="Yıl (Ops.)" style="flex: 1; min-width: 50px;">
                    <input type="number" id="sPages" placeholder="Sayfa" style="flex: 1; min-width: 50px;">
                    <select id="sLang" style="flex: 1; min-width: 50px;">
                        <option value="">Dil (Ops.)</option>
                        <option value="tr">Türkçe</option>
                        <option value="en">İngilizce</option>
                        <option value="ja">Japonca</option>
                        <option value="fr">Fransızca</option>
                        <option value="de">Almanca</option>
                    </select>
                </div>
                
                <!-- MANUEL KAPAK VE KİŞİSEL NOTLAR -->
                <input type="text" id="sCoverUrl" placeholder="Manuel Kapak Görseli Linki (Opsiyonel)">
                <textarea id="sNotes" placeholder="Kişisel notlarınız, alıntılarınız veya özet alanı..." rows="3" style="width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color); color: var(--text-color); outline: none; resize: vertical;"></textarea>
                
                <button type="submit" class="action-btn" id="searchApiBtn">🌍 Dünya Veritabanında Ara</button>
                <div style="font-size: 12px; margin-top: 5px; opacity: 0.8;">Veya aratmadan doğrudan kaydet:</div>
                <button type="button" class="action-btn" id="manualSaveBtn" style="background-color: var(--badge-okundu); color: #000; margin-top: 0;">💾 Sadece Yazdıklarımı Kaydet</button>
            </form>
            <div id="loadingText" style="display: none; margin-top: 15px; font-weight: bold;">Aranıyor...</div>
            <div id="apiResults" style="margin-top: 15px; max-height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: left;"></div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="app.js"></script>
</body>
</html>
