<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kütüphane Asistanı</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <h1>Kütüphanem</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Kitap, yazar veya not ara...">
            
            <select id="statusFilter">
                <option value="all">Tümü</option>
                <option value="okundu">Okundu</option>
                <option value="sirada">Sırada</option>
                <option value="okunmadi">Okunmadı</option>
            </select>

            <select id="sortFilter">
                <option value="date-desc">Eklenme Tarihi (Yeni-Eski)</option>
                <option value="pages-asc">Sayfa (Azdan Çoğa)</option>
                <option value="pages-desc">Sayfa (Çoktan Aza)</option>
                <option value="year">Basım Yılı</option>
            </select>
        </div>
    </header>

    <main id="library-grid" class="grid-container">
        <!-- Kitaplar buraya JavaScript ile otomatik eklenecek -->
    </main>

    <!-- Sağ Alt Köşedeki Hızlı İşlem Butonu -->
    <button class="fab-btn" id="addBookBtn">+</button>

    <!-- Kitap Ekleme Pop-up'ı -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeAddModal">&times;</span>
            <h2 style="margin-bottom: 15px;">Yeni Kitap Ekle</h2>
            <div style="display: flex; flex-direction: column; gap: 10px; align-items: center;">
                <button id="scanBarcodeBtn" class="action-btn">📷 Barkod Okut</button>
                <button id="manualAddBtn" class="action-btn">✍️ Elle Ekle</button>
            </div>
            <div id="reader" style="width: 100%; margin-top: 15px; display: none;"></div>
        </div>
    </div>
    <!-- Elle Kitap Ekleme Formu Pop-up'ı -->
    <div id="manualAddModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="closeManualAddModal">&times;</span>
            <h2 style="margin-bottom: 15px;">Kitap Bilgilerini Girin</h2>
            <form id="manualAddForm" style="display: flex; flex-direction: column; gap: 10px;">
                <input type="text" id="newBookTitle" placeholder="Kitap Adı" required>
                <input type="text" id="newBookAuthor" placeholder="Yazar Adı" required>
                <input type="number" id="newBookPages" placeholder="Sayfa Sayısı">
                <select id="newBookStatus">
                    <option value="okunmadi">Okunmadı</option>
                    <option value="sirada">Sırada</option>
                    <option value="okundu">Okundu</option>
                </select>
                <button type="submit" class="action-btn" style="background-color: var(--badge-okundu); color: #000;">Kaydet</button>
            </form>
        </div>
    </div>

    <!-- Barkod Okuyucu Kütüphanesi -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="app.js"></script>
</body>
</html>
